<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Retail Management System</title> <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light"> 
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container"> <a class="navbar-brand fw-bold" href="index.html"> Retail Management </a> <button
                class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"> <span
                    class="navbar-toggler-icon"></span> </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"> <a class="nav-link" href="index.html"> Dashboard </a> </li>
                    <li class="nav-item"> <a class="nav-link" href="products.html"> Products </a> </li>
                    <li class="nav-item"> <a class="nav-link" href="sales.html"> Sales </a> </li>
                </ul> <a href="login.html" class="btn btn-light me-2"> Login </a> <a href="register.html"
                    class="btn btn-outline-light"> Register </a>
            </div>
        </div>
    </nav> 
    <!-- LOGIN FORM -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0 mt-5">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-2"> Login </h2>
                        <p class="text-center text-muted mb-4"> Sign in to your account </p>
                        <form>
                            <div class="mb-3"> <label class="form-label"> Email Address </label> <input type="email"
                                    class="form-control" placeholder="Enter your email" required> </div>
                            <div class="mb-3"> <label class="form-label"> Password </label> <input type="password"
                                    class="form-control" placeholder="Enter your password" required> </div>
                            <div class="d-flex justify-content-between mb-4">
                                <div class="form-check"> <input class="form-check-input" type="checkbox" id="remember">
                                    <label class="form-check-label" for="remember"> Remember me </label> </div> <a
                                    href="#"> Forgot Password? </a>
                            </div> <button type="submit" class="btn btn-primary w-100"> Login </button>
                        </form>
                        <hr>
                        <p class="text-center mb-0"> Don't have an account? <a href="register.html"> Register here </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div> 
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"> </script>
</body>

</html>
