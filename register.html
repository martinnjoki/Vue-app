<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Retail Management System</title> <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light"> 
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container"> <a class="navbar-brand fw-bold" href="index.html"> Retail Management </a> <button
                class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"> <span
                    class="navbar-toggler-icon"></span> </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"> <a class="nav-link" href="index.html"> Dashboard </a> </li>
                    <li class="nav-item"> <a class="nav-link" href="products.html"> Products </a> </li>
                    <li class="nav-item"> <a class="nav-link" href="sales.html"> Sales </a> </li>
                </ul> <a href="login.html" class="btn btn-light me-2"> Login </a> <a href="register.html"
                    class="btn btn-outline-light"> Register </a>
            </div>
        </div>
    </nav> 
    <!-- REGISTRATION FORM -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 mt-5">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-2"> Create Account </h2>
                        <p class="text-center text-muted mb-4"> Register a new user </p>
                        <form>
                            <div class="row">
                                <div class="col-md-6 mb-3"> <label class="form-label"> Full Name </label> <input
                                        type="text" class="form-control" placeholder="John Kamau" required> </div>
                                <div class="col-md-6 mb-3"> <label class="form-label"> Phone Number </label> <input
                                        type="tel" class="form-control" placeholder="07XX XXX XXX"> </div>
                            </div>
                            <div class="mb-3"> <label class="form-label"> Email Address </label> <input type="email"
                                    class="form-control" placeholder="example@gmail.com" required> </div>
                            <div class="row">
                                <div class="col-md-6 mb-3"> <label class="form-label"> Password </label> <input
                                        type="password" class="form-control" placeholder="Enter password" required>
                                </div>
                                <div class="col-md-6 mb-3"> <label class="form-label"> Confirm Password </label> <input
                                        type="password" class="form-control" placeholder="Confirm password" required>
                                </div>
                            </div>
                            <div class="mb-3"> <label class="form-label"> User Role </label> <select
                                    class="form-select">
                                    <option value=""> Select Role </option>
                                    <option> Cashier </option>
                                    <option> Manager </option>
                                    <option> Administrator </option>
                                </select> </div>
                            <div class="form-check mb-4"> <input class="form-check-input" type="checkbox" id="terms"
                                    required> <label class="form-check-label" for="terms"> I agree to the terms and
                                    conditions. </label> </div> <button type="submit" class="btn btn-primary w-100">
                                Create Account </button>
                        </form>
                        <hr>
                        <p class="text-center mb-0"> Already have an account? <a href="login.html"> Login here </a> </p>
                    </div>
                </div>
            </div>
        </div>
    </div> 
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"> </script>
</body>

</html>
