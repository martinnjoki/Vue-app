<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- Vue Application -->
    <div class="container" id="app">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-6">

                <div class="card shadow-sm border-0 mt-5">

                    <div class="card-body p-5">

                        <h2 class="text-center mb-2">
                            Create Account
                        </h2>

                        <p class="text-center text-muted mb-4">
                            Register a new user
                        </p>


                        <!-- Registration Form -->
                        <form @submit.prevent="register_user">

                            <div class="row">

                                <!-- Full Name -->
                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Full Name
                                    </label>

                                    <input type="text" class="form-control" placeholder="John Kamau" v-model="full_name"
                                        required>

                                </div>




                            </div>


                            <!-- Email -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input type="email" class="form-control" placeholder="example@gmail.com"
                                    v-model="email_address" required>

                            </div>


                            <div class="row">

                                <!-- Password -->
                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Password
                                    </label>

                                    <input type="password" class="form-control" placeholder="Enter password"
                                        v-model="password" required>

                                </div>


                                <!-- Confirm Password -->
                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Confirm Password
                                    </label>

                                    <input type="password" class="form-control" placeholder="Confirm password">

                                </div>

                            </div>



                            <!-- Terms -->
                            <div class="form-check mb-4">

                                <input class="form-check-input" type="checkbox" id="terms" required>

                                <label class="form-check-label" for="terms">

                                    I agree to the terms and conditions.

                                </label>

                            </div>


                            <!-- Register Button -->
                            <button type="submit" class="btn btn-primary w-100">

                                Create Account

                            </button>


                            <!-- Success Alert -->
                            <div class="alert alert-success mt-3" v-if="alertSuccessShow">

                                {{ alertMessage }}

                            </div>


                            <!-- Error Alert -->
                            <div class="alert alert-danger mt-3" v-if="alertDangerShow">

                                {{ alertMessage }}

                            </div>

                        </form>


                        <hr>


                        <p class="text-center mb-0">

                            Already have an account?

                            <a href="login.html">
                                Login here
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Vue -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.2.0/vue.js"></script>

    <!-- Axios -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.25.0/axios.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <!-- Vue Application -->
    <script>

        new Vue({

            el: "#app",

            data: {

                full_name: "",

                email_address: "",

                password: "",

                alertMessage: "",

                alertSuccessShow: false,

                alertDangerShow: false

            },


            methods: {

                async register_user() {

                    // Check required fields
                    if (
                        this.full_name === "" ||

                        this.email_address === "" ||
                        this.password === ""
                    ) {

                        this.alertDangerShow = true;

                        this.alertSuccessShow = false;

                        this.alertMessage =
                            "Ensure all fields are filled.";

                        return;
                    }


                    try {

                        // Send registration data to Flask
                        const response = await axios.post(
                            "http://127.0.0.1:5000/register",

                            {

                                full_name: this.full_name,

                                phone_number: this.phone_number,

                                email_address: this.email_address,

                                password: this.password

                            }
                        );


                        // Registration successful
                        this.alertDangerShow = false;

                        this.alertSuccessShow = true;

                        this.alertMessage =
                            "User registered successfully.";


                        console.log(response.data);


                        // Save token
                        if (response.data.token) {

                            localStorage.setItem(
                                "token",
                                response.data.token
                            );

                        }


                        // Redirect
                        window.location.href = "index.html";


                    } catch (error) {

                        console.log(error);

                        this.alertSuccessShow = false;

                        this.alertDangerShow = true;

                        this.alertMessage =
                            error.response?.data?.message ||
                            "Registration failed.";

                    }

                }

            },


            mounted() {

                // Check if user is already logged in
                if (localStorage.getItem("token") !== null) {

                    window.location.href = "index.html";

                }

            }

        });

    </script>

</body>

</html>
